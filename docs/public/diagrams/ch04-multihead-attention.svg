<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">多头注意力的投影、并行聚合与融合过程</title>
  <desc id="desc">同一输入经过各自独立的查询、键和值投影进入多个注意力头，每个头学习不同关系，结果拼接后通过输出投影形成新的上下文表示。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}
    .title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:16px}.note{font-size:15px;fill:#526076}
    .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none}
  </style>
  <rect width="1440" height="620" rx="24" fill="#f8fafc"/>
  <text x="56" y="54" class="title">多头注意力：在不同表示子空间中并行学习关系，再统一融合</text>

  <g transform="translate(55 245)">
    <rect width="190" height="125" rx="16" fill="#dbeafe"/>
    <text x="24" y="45" class="label">输入表示 X</text>
    <text x="24" y="75" class="body">序列长度 × d_model</text>
    <text x="24" y="101" class="note">同一输入，不同投影</text>
  </g>

  <g transform="translate(350 100)">
    <rect width="495" height="130" rx="16" fill="#ede9fe"/>
    <text x="22" y="37" class="label">Head 1：局部关系示意</text>
    <rect x="22" y="53" width="178" height="54" rx="10" fill="#ddd6fe"/>
    <text x="38" y="86" class="body">Q₁ / K₁ / V₁ 投影</text>
    <path d="M212 80H260" class="arrow"/>
    <rect x="272" y="53" width="198" height="54" rx="10" fill="#c4b5fd"/>
    <text x="291" y="86" class="body">Attention → head₁</text>
  </g>
  <g transform="translate(350 245)">
    <rect width="495" height="130" rx="16" fill="#e0e7ff"/>
    <text x="22" y="37" class="label">Head 2：长距离关系示意</text>
    <rect x="22" y="53" width="178" height="54" rx="10" fill="#c7d2fe"/>
    <text x="38" y="86" class="body">Q₂ / K₂ / V₂ 投影</text>
    <path d="M212 80H260" class="arrow"/>
    <rect x="272" y="53" width="198" height="54" rx="10" fill="#a5b4fc"/>
    <text x="291" y="86" class="body">Attention → head₂</text>
  </g>
  <g transform="translate(350 390)">
    <rect width="495" height="130" rx="16" fill="#fce7f3"/>
    <text x="22" y="37" class="label">Head h：其他关系子空间</text>
    <rect x="22" y="53" width="178" height="54" rx="10" fill="#fbcfe8"/>
    <text x="38" y="86" class="body">Qₕ / Kₕ / Vₕ 投影</text>
    <path d="M212 80H260" class="arrow"/>
    <rect x="272" y="53" width="198" height="54" rx="10" fill="#f9a8d4"/>
    <text x="291" y="86" class="body">Attention → headₕ</text>
  </g>

  <path d="M245 307C290 307 290 165 340 165" class="arrow"/>
  <path d="M245 307H340" class="arrow"/>
  <path d="M245 307C290 307 290 455 340 455" class="arrow"/>

  <g transform="translate(930 205)">
    <rect width="185" height="205" rx="16" fill="#ffedd5"/>
    <text x="29" y="48" class="label">Concat</text>
    <text x="29" y="80" class="body">[head₁; head₂; …]</text>
    <line x1="29" y1="104" x2="156" y2="104" class="dash"/>
    <text x="29" y="139" class="label">输出投影 Wᴼ</text>
    <text x="29" y="171" class="note">融合不同关系摘要</text>
  </g>
  <path d="M845 165C890 165 890 267 920 267" class="arrow"/>
  <path d="M845 310H920" class="arrow"/>
  <path d="M845 455C890 455 890 347 920 347" class="arrow"/>

  <g transform="translate(1200 245)">
    <rect width="185" height="125" rx="16" fill="#dcfce7"/>
    <text x="22" y="45" class="label">输出表示</text>
    <text x="22" y="75" class="body">序列长度 × d_model</text>
    <text x="22" y="101" class="note">供残差与后续层使用</text>
  </g>
  <path d="M1115 307H1190" class="arrow"/>

  <text x="350" y="572" class="note">关键判断：多个头不是复制同一张注意力图；独立的 Q/K/V 投影让每个头能在不同子空间定义“什么叫相关”。</text>
</svg>
