<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">优化作为一个由目标、约束、更新和验证组成的系统</title><desc id="desc">数据和表示定义目标与约束，优化器更新参数，验证集检查泛化，部署反馈形成下一轮改进。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.n{font-size:20px;font-weight:700}.s{font-size:15px;fill:#526076}.a{stroke:#7b879d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b879d"/></marker></defs>
<rect width="1440" height="500" rx="24" fill="#f8fafc"/><text x="60" y="60" class="t">优化不是“选一个优化器”，而是定义并验证一个可迭代的决策系统</text>
<g transform="translate(60 150)"><rect width="220" height="145" rx="18" fill="#dbeafe"/><text x="24" y="43" class="n">数据与表示</text><text x="24" y="76" class="s">观测什么？如何编码？</text><text x="24" y="108" class="s">训练集与验证集是否匹配？</text></g><g transform="translate(340 150)"><rect width="220" height="145" rx="18" fill="#e0e7ff"/><text x="24" y="43" class="n">目标与约束</text><text x="24" y="76" class="s">损失、错误代价、资源预算</text><text x="24" y="108" class="s">例：Pfa ≤ α 或延迟 ≤ SLO</text></g><g transform="translate(620 150)"><rect width="220" height="145" rx="18" fill="#ede9fe"/><text x="24" y="43" class="n">更新规则</text><text x="24" y="76" class="s">梯度、学习率、动量、Adam</text><text x="24" y="108" class="s">决定如何探索参数空间</text></g><g transform="translate(900 150)"><rect width="220" height="145" rx="18" fill="#ffedd5"/><text x="24" y="43" class="n">验证与泛化</text><text x="24" y="76" class="s">是否真的解决新样本？</text><text x="24" y="108" class="s">监测过拟合与数值不稳定</text></g><g transform="translate(1180 150)"><rect width="180" height="145" rx="18" fill="#dcfce7"/><text x="24" y="43" class="n">部署决策</text><text x="24" y="76" class="s">预测、判决、生成</text><text x="24" y="108" class="s">记录真实反馈</text></g>
<path d="M281 222H331M561 222H611M841 222H891M1121 222H1171" class="a"/><path d="M1270 297 C1270 390,170 390,170 305" class="a"/><text x="420" y="438" class="s">阈值选择、线性模型训练、深度网络训练和服务路由，变量不同，但都必须说明目标、约束、更新与评估。</text>
</svg>
