<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">量化、剪枝和蒸馏的选择关系</title>
  <desc id="desc">从部署瓶颈出发选择模型压缩方法：显存和带宽优先考虑量化，有稀疏硬件支持时考虑剪枝，需要小模型替代大模型且任务边界稳定时考虑蒸馏，所有方案都必须经过业务评估。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#64748b"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}
    .title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:16px}.note{font-size:15px;fill:#526076}
    .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.risk{stroke:#dc2626;stroke-width:2;stroke-dasharray:7 6;fill:none}
  </style>
  <rect width="1440" height="720" rx="24" fill="#f8fafc"/>
  <text x="56" y="54" class="title">模型压缩不是固定套餐：先定位瓶颈，再验证收益能否在目标系统兑现</text>

  <g transform="translate(55 245)">
    <rect width="230" height="150" rx="16" fill="#dbeafe"/>
    <text x="24" y="42" class="label">先定义部署约束</text>
    <text x="24" y="76" class="body">显存 / 带宽 / 延迟</text>
    <text x="24" y="103" class="body">硬件 / 框架 / 任务边界</text>
    <text x="24" y="130" class="note">不要只看模型文件大小</text>
  </g>

  <g transform="translate(385 90)">
    <rect width="285" height="190" rx="16" fill="#e0e7ff"/>
    <text x="24" y="42" class="label">量化</text>
    <text x="24" y="76" class="body">降低权重或激活精度</text>
    <text x="24" y="106" class="body">优先解决：显存、带宽</text>
    <text x="24" y="139" class="note">收益较易兑现，常作首选</text>
    <text x="24" y="166" class="note">风险：长尾能力与低 bit 退化</text>
  </g>
  <g transform="translate(385 330)">
    <rect width="285" height="190" rx="16" fill="#fef3c7"/>
    <text x="24" y="42" class="label">剪枝 / 稀疏化</text>
    <text x="24" y="76" class="body">删除权重或网络结构</text>
    <text x="24" y="106" class="body">前提：硬件支持稀疏加速</text>
    <text x="24" y="139" class="note">模型变稀疏不等于延迟下降</text>
    <text x="24" y="166" class="note">风险：结构能力与校准成本</text>
  </g>
  <g transform="translate(385 570)">
    <rect width="285" height="82" rx="16" fill="#fce7f3"/>
    <text x="24" y="34" class="label">蒸馏</text>
    <text x="24" y="62" class="body">用大模型行为训练任务型小模型</text>
  </g>

  <path d="M285 320C335 320 335 185 375 185" class="arrow"/>
  <path d="M285 320C335 320 335 425 375 425" class="arrow"/>
  <path d="M285 320C335 320 335 611 375 611" class="arrow"/>

  <g transform="translate(785 155)">
    <rect width="270" height="330" rx="18" fill="#ffedd5"/>
    <text x="25" y="44" class="label">系统侧验证</text>
    <text x="25" y="84" class="body">模型能否在目标框架加载？</text>
    <text x="25" y="119" class="body">目标硬件是否有对应内核？</text>
    <text x="25" y="154" class="body">吞吐和延迟是否真实改善？</text>
    <text x="25" y="189" class="body">峰值显存是否满足并发？</text>
    <line x1="25" y1="218" x2="245" y2="218" class="risk"/>
    <text x="25" y="255" class="label">业务侧验证</text>
    <text x="25" y="292" class="body">核心任务 + 长尾失败集</text>
  </g>
  <path d="M670 185H775" class="arrow"/>
  <path d="M670 425H775" class="arrow"/>
  <path d="M670 611C730 611 730 450 775 450" class="arrow"/>

  <g transform="translate(1160 245)">
    <rect width="225" height="150" rx="16" fill="#dcfce7"/>
    <text x="24" y="42" class="label">部署决策</text>
    <text x="24" y="76" class="body">收益满足 SLO</text>
    <text x="24" y="103" class="body">质量回退可接受</text>
    <text x="24" y="130" class="note">否则换方法或保留基线</text>
  </g>
  <path d="M1055 320H1150" class="arrow"/>

  <text x="385" y="692" class="note">蒸馏适合任务边界稳定、可构造训练集且允许小模型只覆盖部分能力的场景。</text>
</svg>
