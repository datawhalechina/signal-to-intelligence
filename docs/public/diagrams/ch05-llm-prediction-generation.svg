<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
<title id="title">LLM 从表示到生成的统一链路</title><desc id="desc">文本经分词、嵌入和注意力形成上下文表示，输出下一 token 的概率；训练使用真实答案，生成使用采样结果循环。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.n{font-size:20px;font-weight:700}.s{font-size:15px;fill:#526076}.a{stroke:#7b879d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b879d"/></marker></defs>
<rect width="1440" height="470" rx="24" fill="#f8fafc"/><text x="60" y="60" class="t">LLM：同一条链路同时解释预训练与逐 token 生成</text>
<g transform="translate(60 150)"><rect width="190" height="126" rx="16" fill="#dbeafe"/><text x="24" y="48" class="n">文本 → Token</text><text x="24" y="78" class="s">把符号切成可处理单位</text></g><g transform="translate(305 150)"><rect width="190" height="126" rx="16" fill="#e0e7ff"/><text x="24" y="48" class="n">Embedding</text><text x="24" y="78" class="s">离散 token → 向量表示</text></g><g transform="translate(550 150)"><rect width="200" height="126" rx="16" fill="#ede9fe"/><text x="24" y="48" class="n">Attention</text><text x="24" y="78" class="s">聚合历史上下文</text></g><g transform="translate(805 150)"><rect width="200" height="126" rx="16" fill="#ffedd5"/><text x="24" y="48" class="n">概率预测</text><text x="24" y="78" class="s">下一个 token 的分布</text></g><g transform="translate(1060 150)"><rect width="200" height="126" rx="16" fill="#dcfce7"/><text x="24" y="48" class="n">采样与输出</text><text x="24" y="78" class="s">temperature / top-p</text></g>
<path d="M251 213H296M496 213H541M751 213H796M1006 213H1051" class="a"/><path d="M1160 277 C1160 364,400 364,400 287" class="a"/><text x="64" y="338" class="n">训练：</text><text x="128" y="338" class="s">真实下一个 token 提供监督，更新参数。</text><text x="64" y="382" class="n">生成：</text><text x="128" y="382" class="s">采样出的 token 写回上下文，循环直到结束。</text><text x="780" y="382" class="s">Prompt 改输入；微调改参数；RAG 改上下文；Agent 改多步执行。</text>
</svg>
