<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">Prompt、微调、RAG 与 Agent 的选型关系</title><desc id="desc">四种方法并列解决不同瓶颈：输入表达、稳定行为、外部知识和多步行动。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.n{font-size:20px;font-weight:700}.s{font-size:15px;fill:#526076}.a{stroke:#7b879d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b879d"/></marker></defs>
<rect width="1440" height="500" rx="24" fill="#f8fafc"/><text x="60" y="60" class="t">LLM 应用选型：先定位瓶颈，再改变对应的对象</text><text x="60" y="92" class="s">四种方法可组合，但不是从低到高的等级；RAG 是“外部知识”分支，而非默认终点。</text>
<g transform="translate(60 150)"><rect width="280" height="210" rx="18" fill="#dbeafe"/><text x="25" y="43" class="n">Prompt</text><text x="25" y="76" class="s">改变：输入指令、示例、格式</text><text x="25" y="112" class="s">适合：任务澄清、快速验证</text><text x="25" y="148" class="s">风险：能力边界仍在模型内部</text><text x="25" y="180" class="s">先从这里建立验收标准</text></g>
<g transform="translate(390 150)"><rect width="280" height="210" rx="18" fill="#ede9fe"/><text x="25" y="43" class="n">微调</text><text x="25" y="76" class="s">改变：参数或低秩适配器</text><text x="25" y="112" class="s">适合：稳定行为、风格、格式</text><text x="25" y="148" class="s">风险：数据质量、迭代与遗忘</text><text x="25" y="180" class="s">不解决持续变化的事实</text></g>
<g transform="translate(720 150)"><rect width="280" height="210" rx="18" fill="#ffedd5"/><text x="25" y="43" class="n">RAG</text><text x="25" y="76" class="s">改变：外部知识与上下文</text><text x="25" y="112" class="s">适合：私有资料、新鲜事实</text><text x="25" y="148" class="s">风险：检索失败、上下文噪声</text><text x="25" y="180" class="s">不替代模型推理与行动</text></g>
<g transform="translate(1050 150)"><rect width="280" height="210" rx="18" fill="#dcfce7"/><text x="25" y="43" class="n">Agent</text><text x="25" y="76" class="s">改变：多步流程、工具调用</text><text x="25" y="112" class="s">适合：查询、计算、执行任务</text><text x="25" y="148" class="s">风险：错误累积、权限与成本</text><text x="25" y="180" class="s">必须加入边界与可观测性</text></g>
<path d="M200 392H1190" class="a"/><text x="60" y="430" class="n">共同流程：</text><text x="175" y="430" class="s">定义任务与指标 → 找到知识/行为/行动瓶颈 → 选最小改动方案 → 用质量、成本、延迟和风险验证。</text>
</svg>
