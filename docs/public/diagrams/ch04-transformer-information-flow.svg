<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
<title id="title">Transformer 的信息流</title><desc id="desc">Token 经嵌入和位置编码进入 Transformer block，通过注意力聚合、前馈变换和残差归一化形成上下文表示。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.n{font-size:20px;font-weight:700}.s{font-size:15px;fill:#526076}.a{stroke:#7b879d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b879d"/></marker></defs>
<rect width="1440" height="470" rx="24" fill="#f8fafc"/><text x="60" y="60" class="t">Transformer：把固定处理升级为内容依赖的信息路由</text>
<g transform="translate(60 150)"><rect width="185" height="130" rx="16" fill="#dbeafe"/><text x="24" y="48" class="n">Token / 特征</text><text x="24" y="78" class="s">离散符号或输入向量</text></g>
<g transform="translate(305 150)"><rect width="200" height="130" rx="16" fill="#e0e7ff"/><text x="24" y="48" class="n">表示 + 位置</text><text x="24" y="78" class="s">Embedding 回答“是什么”</text><text x="24" y="102" class="s">Position 回答“在哪里”</text></g>
<g transform="translate(565 110)"><rect width="430" height="210" rx="18" fill="#ede9fe"/><text x="24" y="43" class="n">Transformer Block</text><rect x="24" y="66" width="178" height="104" rx="12" fill="#ddd6fe"/><text x="42" y="103" class="n">Q / K / V</text><text x="42" y="130" class="s">相关性 + Mask</text><text x="42" y="153" class="s">动态聚合上下文</text><rect x="228" y="66" width="178" height="104" rx="12" fill="#ddd6fe"/><text x="250" y="103" class="n">FFN</text><text x="250" y="130" class="s">逐位置非线性变换</text><text x="250" y="153" class="s">残差 + LayerNorm</text><path d="M202 118H220" class="a"/></g>
<g transform="translate(1055 150)"><rect width="185" height="130" rx="16" fill="#ffedd5"/><text x="24" y="48" class="n">上下文表示</text><text x="24" y="78" class="s">每个位置吸收相关信息</text></g>
<g transform="translate(1290 150)"><rect width="100" height="130" rx="16" fill="#dcfce7"/><text x="15" y="48" class="n">下游</text><text x="15" y="78" class="s">理解</text><text x="15" y="102" class="s">生成</text></g>
<path d="M246 215H296M506 215H556M996 215H1046M1241 215H1281" class="a"/><text x="566" y="382" class="s">关键区别：卷积使用固定局部核；注意力按当前内容决定“看谁、看多少”，并可用 Mask 限制信息方向。</text>
</svg>
