<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">云端与端侧智能系统的生产反馈闭环</title><desc id="desc">请求和多模态观测经过治理路由与云端或端侧模型服务形成响应，信号质量、对齐、任务结果、延迟、成本和可靠性被持续评估，再反馈到表示、压缩与系统配置。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.n{font-size:20px;font-weight:700}.s{font-size:15px;fill:#526076}.a{stroke:#7b879d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b879d"/></marker></defs>
<rect width="1440" height="500" rx="24" fill="#f8fafc"/><text x="60" y="60" class="t">智能系统工程：云端与端侧都要进入质量、资源与可靠性的反馈闭环</text>
<g transform="translate(60 145)"><rect width="180" height="126" rx="16" fill="#dbeafe"/><text x="24" y="48" class="n">请求与观测</text><text x="24" y="78" class="s">文本、图像、信号、权限</text></g><g transform="translate(295 145)"><rect width="200" height="126" rx="16" fill="#e0e7ff"/><text x="24" y="48" class="n">治理与路由</text><text x="24" y="78" class="s">安全、缓存、模型选择</text></g><g transform="translate(550 145)"><rect width="200" height="126" rx="16" fill="#ede9fe"/><text x="24" y="48" class="n">云端 / 端侧推理</text><text x="24" y="78" class="s">表示、压缩、调度、回退</text></g><g transform="translate(805 145)"><rect width="180" height="126" rx="16" fill="#ffedd5"/><text x="24" y="48" class="n">响应交付</text><text x="24" y="78" class="s">流式输出与设备行动</text></g><g transform="translate(1040 145)"><rect width="300" height="126" rx="16" fill="#dcfce7"/><text x="24" y="48" class="n">联合评估与监控</text><text x="24" y="78" class="s">信号 · 对齐 · 任务 · 资源 · 安全</text></g><path d="M241 208H286M496 208H541M751 208H796M986 208H1031" class="a"/>
<g transform="translate(360 345)"><rect width="720" height="86" rx="16" fill="#ccfbf1"/><text x="28" y="38" class="n">反馈与迭代</text><text x="28" y="65" class="s">回归集、表示与 token 调整、压缩策略、路由、容量规划、版本回退</text></g><path d="M1190 272 C1190 330,1080 330,1080 336" class="a"/><path d="M360 388 C140 388,140 288,140 281" class="a"/><text x="60" y="474" class="s">工程选择没有绝对最优：先定义任务质量与设备预算，再在信息保留、延迟、内存、功耗和可靠性之间做可观测的取舍。</text>
</svg>
