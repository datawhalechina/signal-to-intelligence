[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signals-to-intelligence"
version = "3.2.0"
description = "从数字信号处理到大语言模型的思想演化与代码实践"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Claude", email = "noreply@anthropic.com"}
]
keywords = [
    "DSP",
    "signal-processing",
    "deep-learning",
    "transformer",
    "LLM",
    "multimodal",
    "education"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.7.0",
    "openai>=1.0.0",
]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
rag = [
    "langchain>=0.1.0",
    "faiss-cpu>=1.7.0",
]
hf = [
    "transformers>=4.40.0",
    "datasets>=2.20.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
    "huggingface_hub>=0.23.0",
]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "signals-to-intelligence[llm,ml,rag,hf,dev]",
]

[project.urls]
Homepage = "https://datawhalechina.github.io/signal-to-intelligence/"
Documentation = "https://datawhalechina.github.io/signal-to-intelligence/"
Repository = "https://github.com/datawhalechina/signal-to-intelligence"
Issues = "https://github.com/datawhalechina/signal-to-intelligence/issues"

[tool.setuptools]
packages = ["code", "tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
